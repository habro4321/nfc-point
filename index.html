<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 텀블러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;600&family=Gowun+Batang:wght@700&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --page:#F6F2EC; --sheet:#FBF8F4; --tile:#FFFFFF; --card:#FBF8F4;
  --glass:rgba(252,249,245,.5); --glass-line:rgba(255,255,255,.7); --glass-in:rgba(255,255,255,.4); --glass-strong:rgba(252,249,245,.8);
  --ink:#2B221D; --ink2:#594E47; --ink3:#8C8078; --line:#E4DACE; --track:rgba(43,34,29,.1); --fill:#5A3A27;
  --ok-bg:rgba(227,236,226,.82); --ok:#35573E; --wait-bg:rgba(243,228,203,.82); --wait:#744809;
  --btn:#2B221D; --on-btn:#F6F2EC; --focus:#3B6045;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#1F1A17; --sheet:#241E1A; --tile:#2E2621; --card:#2A231F;
    --glass:rgba(34,28,24,.5); --glass-line:rgba(255,255,255,.12); --glass-in:rgba(255,255,255,.06); --glass-strong:rgba(34,28,24,.82);
    --ink:#F2EAE1; --ink2:#D0C4B8; --ink3:#9E9187; --line:#3E342D; --track:rgba(255,255,255,.14); --fill:#D2AE86;
    --ok-bg:rgba(44,58,46,.82); --ok:#B4D6BA; --wait-bg:rgba(62,49,33,.82); --wait:#EDC68A;
    --btn:#F2EAE1; --on-btn:#231C18; --focus:#A9CDB0;
  }
}
:root[data-theme="dark"]{
  --page:#1F1A17; --sheet:#241E1A; --tile:#2E2621; --card:#2A231F;
  --glass:rgba(34,28,24,.5); --glass-line:rgba(255,255,255,.12); --glass-in:rgba(255,255,255,.06); --glass-strong:rgba(34,28,24,.82);
  --ink:#F2EAE1; --ink2:#D0C4B8; --ink3:#9E9187; --line:#3E342D; --track:rgba(255,255,255,.14); --fill:#D2AE86;
  --ok-bg:rgba(44,58,46,.82); --ok:#B4D6BA; --wait-bg:rgba(62,49,33,.82); --wait:#EDC68A;
  --btn:#F2EAE1; --on-btn:#231C18; --focus:#A9CDB0;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
p{margin:0}
[hidden]{display:none!important}

#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--page)}
#bg img{position:absolute;max-width:none;user-select:none}

.screen{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 0;min-height:44px}
.pill{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink2);font-size:12px;font-weight:600}
.spacer{flex:1}
.gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--page);text-align:center}
.gate p{max-width:290px;font-size:15px;font-weight:600;line-height:1.6;color:var(--ink2)}
.gate button{margin-top:18px;height:48px;min-width:140px;padding:0 24px;border:0;border-radius:14px;background:var(--btn);color:var(--on-btn);font-size:15px;font-weight:600}
.gate small{display:block;margin-top:6px;font-size:12.5px;font-weight:500;color:var(--ink3)}
#authBtn{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 16px 10px;transition:flex-basis .3s}
.cup-wrap{position:relative;flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.cup{position:relative;height:100%;max-height:380px;min-height:0;aspect-ratio:220/370;touch-action:none;transform-origin:50% 88%;cursor:grab}
.cup svg.sil{position:absolute;inset:0;filter:drop-shadow(0 10px 18px rgba(30,22,18,.13))}
body.bg-busy .cup svg.sil{filter:drop-shadow(0 0 1.2px rgba(255,255,255,.85)) drop-shadow(0 10px 20px rgba(30,22,18,.22))}
.cup svg.main{position:relative}
.cup svg{width:100%;height:100%;display:block;overflow:visible}
.chip{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--wait-bg);color:var(--wait);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}

.panel{margin:0 12px 12px;padding:18px 18px 14px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glass-line);box-shadow:0 12px 36px rgba(43,34,29,.12)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .panel,.pill,.chip{background:var(--card)} }
.label{font-size:13px;font-weight:600;color:var(--ink2)}
.points{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.points b{font-family:Outfit,sans-serif;font-weight:600;font-size:clamp(60px,19vw,92px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.points span{font-family:Outfit,sans-serif;font-weight:500;font-size:24px;color:var(--ink3)}
.unlock{margin-top:14px;padding:13px 14px 12px;border:1px solid var(--glass-line);border-radius:18px;background:var(--glass-in)}
.u-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.u-row small{font-size:12px;font-weight:500;color:var(--ink3)}
.bar{margin-top:10px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--fill);transition:width .6s ease}
.u-next{margin-top:11px;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.45;color:var(--ink2)}
.u-next b{color:var(--ink);font-weight:700}
.u-thumb{width:30px;height:48px;flex:none;display:flex;align-items:center;justify-content:center}
.u-thumb svg{width:100%;height:100%}
.sw{display:block;width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.cta{margin-top:12px;width:100%;height:52px;border:0;border-radius:16px;background:var(--btn);color:var(--on-btn);font-size:15px;font-weight:600}
.brand{margin-top:10px;text-align:center;font-family:Outfit,sans-serif;font-size:11px;font-weight:500;letter-spacing:.22em;color:var(--ink3)}

body.editing .stage{flex:0 0 55%}
body.editing .panel{visibility:hidden}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:480px;margin:0 auto;height:45%;background:var(--sheet);border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px rgba(0,0,0,.08);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px 18px}
.sheet-head h2{margin:0;font-size:15px;font-weight:700}
.done{height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--btn);color:var(--on-btn);font-size:13px;font-weight:600}
.pv{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 12px 4px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--wait-bg);color:var(--wait);font-size:12px;font-weight:600}
.pv button{flex:none;white-space:nowrap;height:30px;padding:0 10px;border-radius:999px;border:0;background:var(--btn);color:var(--on-btn);font-size:12px;font-weight:600}
.tabs{display:flex;gap:5px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-size:12.5px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.opts{flex:1;overflow-y:auto;padding:0 12px 16px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;padding:6px 2px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--tile);font-size:11px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.pv-on{border-color:var(--wait);border-style:dashed}
.opt .th{width:30px;height:50px;display:flex;align-items:center;justify-content:center}
.opt .th svg{width:100%;height:100%}
.opt .nm{line-height:1.25;text-align:center;word-break:keep-all}
.opt.locked{color:var(--ink3)}
.opt.locked .th,.opt.locked .dot{opacity:.7;filter:saturate(.75)}
.opt .lk{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3)}
.opt .price{font-size:11px;font-weight:700;line-height:17px;padding:0 7px;border-radius:999px;background:var(--btn);color:var(--on-btn)}
.legend{display:flex;gap:14px;align-items:center;padding:0 16px 8px;font-size:11px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{font-style:normal;font-size:10px;font-weight:700;line-height:16px;padding:0 6px;border-radius:999px;background:var(--btn);color:var(--on-btn)}
.pv-acts{flex:none;display:flex;gap:6px}
.pv #pvOff{background:transparent;color:var(--wait);box-shadow:inset 0 0 0 1px currentColor}
.opt .dot{width:30px;height:30px;margin:10px 0;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.opt .ic{width:24px;height:24px;margin:13px 0}
.opt .ft{height:50px;display:flex;align-items:center;font-size:17px;color:var(--ink)}
.eng{display:flex;gap:6px}
.eng input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--ink);font:inherit;font-size:15px}
.eng input::placeholder{color:var(--ink3)}
.eng .ghost{flex:none;padding:0 14px}
.eng-count{margin:4px 2px 0;font-size:11px;color:var(--ink3);text-align:right}
.sec{margin:12px 2px 6px;font-size:12px;font-weight:600;color:var(--ink2)}
.sec:first-child{margin-top:2px}
.photo{display:flex;flex-direction:column;gap:6px}
.photo-btn{height:44px;border-radius:12px;border:1.5px dashed var(--ink3);background:transparent;font-size:13px;font-weight:600}
.photo-row{display:flex;gap:6px;align-items:stretch}
.photo-row .opt{flex:0 0 72px}
.photo-row .ph{width:34px;height:50px;object-fit:cover;border-radius:6px}
.photo-acts{flex:1;display:flex;flex-direction:column;gap:6px}
.ghost{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--tile);font-size:12.5px;font-weight:600}

.crop{position:fixed;inset:0;z-index:30;background:#15110E;color:#F6F2EC;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.crop-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px}
.crop-head h2{margin:0;font-size:15px;font-weight:600}
.c-btn{height:40px;min-width:64px;padding:0 14px;border-radius:999px;border:1px solid rgba(246,242,236,.32);background:transparent;color:#F6F2EC;font-size:14px;font-weight:600}
.c-btn.solid{background:#F6F2EC;color:#2B221D;border-color:#F6F2EC}
.crop-area{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab}
.crop-area.drag{cursor:grabbing}
#cropImg{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-frame{position:absolute;border:2px solid #F6F2EC;border-radius:14px;box-shadow:0 0 0 200vmax rgba(21,17,14,.64);pointer-events:none}
.crop-card{position:absolute;border:1.5px dashed rgba(246,242,236,.85);border-radius:14px;background:rgba(246,242,236,.16);display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:12px;font-weight:500;color:#F6F2EC}
.crop-tools{display:flex;align-items:center;gap:12px;padding:14px 18px 6px;font-size:13px}
.crop-tools input{flex:1;accent-color:#F6F2EC;height:32px}
.crop-hint{padding:0 18px 16px;font-size:12px;color:#C9BDB1;text-align:center}

.side{position:fixed;right:0;top:calc(236px + env(safe-area-inset-top,0px));z-index:35;width:min(300px,86vw);max-height:min(46vh,380px);display:flex;flex-direction:column;padding:12px 12px 12px 16px;border-radius:22px 0 0 22px;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--glass-line);border-right:0;box-shadow:-14px 18px 44px rgba(43,34,29,.2);transform:translateX(106%);transition:transform .4s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.side.show{transform:none}
.side.drag{transition:none}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-head h2{margin:0;font-size:14px;font-weight:700}
.side-x{flex:none;width:44px;height:44px;margin:-8px -8px -8px 0;border:0;border-radius:50%;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.side-list{list-style:none;margin:6px 0 0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.side-item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 6px;border-radius:14px;background:var(--glass-in);border:1px solid var(--glass-line)}
.side-th{width:36px;height:56px;flex:none;display:flex;align-items:center;justify-content:center}
.side-th svg{width:100%;height:100%}
.side-th .sw{width:32px;height:32px}
.side-tx{flex:1;min-width:0}
.side-tx b{display:block;font-size:13.5px;font-weight:700;line-height:1.35;word-break:keep-all}
.side-tx small{display:block;margin-top:2px;font-size:12px;color:var(--ink3)}
.side-go{flex:none;height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--btn);color:var(--on-btn);font-size:12px;font-weight:600;white-space:nowrap}
.side-go[aria-pressed="true"]{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.side-next{margin-top:10px;padding:0 2px;font-size:12px;line-height:1.45;color:var(--ink2)}
.side-next b{color:var(--ink);font-weight:700}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:40;max-width:90vw;padding:10px 16px;border-radius:999px;background:var(--btn);color:var(--on-btn);font-size:13px;font-weight:600;opacity:0;transform:translate(-50%,-16px);transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<div class="gate" id="gate" role="status"><p>불러오는 중…</p></div>

<main class="screen">
  <div class="top">
    <button class="pill" id="tiltBtn" hidden>기울이면 출렁여요</button>
    <span class="spacer"></span>
    <button class="pill" id="authBtn">로그인</button>
  </div>

  <section class="stage" aria-label="내 텀블러">
    <p class="chip" id="status" role="status"></p>
    <div class="cup-wrap"><div class="cup" id="cup" aria-label="텀블러. 좌우로 끌면 음료가 출렁여요" role="img"></div></div>
  </section>

  <section class="panel" id="panel" aria-label="포인트">
    <p class="label" id="who">내 포인트</p>
    <p class="points"><b id="pts">130</b><span>P</span></p>
    <div class="unlock" id="unlock"></div>
    <button class="cta" id="openEdit">내 텀블러 꾸미기</button>
    <p class="brand">GREEN SIGNAL</p>
  </section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle" aria-hidden="true" inert>
  <div class="sheet-head"><h2 id="sheetTitle">내 텀블러 꾸미기</h2><button class="done" id="done">완료</button></div>
  <div class="pv" id="pv" hidden><span id="pvText"></span><span class="pv-acts"><button id="pvBuy" hidden>사기</button><button id="pvOff">그만 보기</button></span></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="꾸미기 항목">
    <button class="tab" role="tab" data-tab="shape">모양</button>
    <button class="tab" role="tab" data-tab="drink">음료</button>
    <button class="tab" role="tab" data-tab="topping">토핑</button>
    <button class="tab" role="tab" data-tab="lid">뚜껑</button>
    <button class="tab" role="tab" data-tab="bg">배경</button>
    <button class="tab" role="tab" data-tab="label">각인</button>
  </div>
  <p class="legend"><span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>포인트를 모으면 열려요</span><span><i>P</i>포인트로 살 수 있어요</span></p>
  <div class="opts" id="opts" role="tabpanel"></div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<div class="crop" id="crop" role="dialog" aria-modal="true" aria-labelledby="cropTitle" hidden>
  <div class="crop-head">
    <button class="c-btn" id="cropCancel">취소</button>
    <h2 id="cropTitle">사진 위치 정하기</h2>
    <button class="c-btn solid" id="cropApply">적용</button>
  </div>
  <div class="crop-area" id="cropArea" tabindex="0" aria-label="사진 위치 조절. 화살표로 옮기고 더하기, 빼기로 크기를 바꿔요">
    <img id="cropImg" alt="">
    <div class="crop-frame" id="cropFrame"><div class="crop-card" id="cropCard">이 부분은 포인트 카드에 가려져요</div></div>
  </div>
  <div class="crop-tools">
    <label for="zoom">크기</label>
    <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
    <button class="c-btn" id="cropReset">원래대로</button>
  </div>
  <p class="crop-hint">드래그해서 옮기고, 두 손가락이나 막대로 크기를 바꿔요</p>
</div>

<aside class="side" id="side" aria-labelledby="sideTitle" hidden>
  <div class="side-head"><h2 id="sideTitle">새로 추가됐어요</h2><button class="side-x" id="sideX" aria-label="알림 닫기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <ul class="side-list" id="sideList" aria-live="polite"></ul>
  <p class="side-next" id="sideNext"></p>
</aside>

<div class="toast" id="toast" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyr_Zw3RaiIyXdkuRNg91G8zTYDzLU-GU",
  authDomain: "sungkyul-creative-challenge.firebaseapp.com",
  projectId: "sungkyul-creative-challenge",

function onOri(e){

let lastWall = Date.now(), lastT = performance.now(), shownSec = -1;
function frame(t){
  const dt = Math.min(.05, Math.max(0, (t-lastT)/1000)); lastT = t;
  const sec = Math.ceil(remainMs()/1000); if(sec !== shownSec){ shownSec = sec; renderStatus(); }
  const lv = level(); disp = Math.abs(lv-disp) > .003 ? disp + (lv-disp)*Math.min(1, dt*3.2) : lv;
  cupAng += ((dragAng==null?0:dragAng) - cupAng) * Math.min(1, dt*10);
  cupEl.style.transform = Math.abs(cupAng) > .0005 ? 'rotate('+(cupAng*57.2958).toFixed(2)+'deg)' : '';
  const target = (gyroT||0) - cupAng;
  if(reduce){ PH.th = target; PH.amp = 0; }
  else {
    PH.om += (-30*(PH.th-target) - 3.6*PH.om)*dt; PH.th += PH.om*dt;
    const at = .8 + Math.min(7, Math.abs(PH.om)*4); PH.amp += (at-PH.amp)*Math.min(1, dt*2.5);

function downscale(file){
  return new Promise((res, rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)), w=Math.round(im.naturalWidth*k), h=Math.round(im.naturalHeight*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(url); res({src:cv.toDataURL('image/jpeg',.86), w:w, h:h}); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('load')); };
    im.src=url;
  });
}

function layoutCrop(init){

  const ar=area.getBoundingClientRect(), bg=$('#bg'), A=bg.clientWidth/bg.clientHeight; let keep=null;
  if(!init && C.W){ const s=C.cover*C.z; keep={cx:(C.W/2-C.x)/(C.w*s), cy:(C.H/2-C.y)/(C.h*s)}; }
  let fh=ar.height*.86, fw=fh*A; if(fw>ar.width*.88){ fw=ar.width*.88; fh=fw/A; }
  C.W=fw; C.H=fh; C.fx=(ar.width-fw)/2; C.fy=(ar.height-fh)/2; C.cover=Math.max(fw/C.w, fh/C.h);
  const f=$('#cropFrame').style; f.left=C.fx+'px'; f.top=C.fy+'px'; f.width=fw+'px'; f.height=fh+'px';
  const cc=$('#cropCard').style; cc.left=(PR.l*100)+'%'; cc.right=(PR.r*100)+'%'; cc.bottom=(PR.b*100)+'%'; cc.height=(PR.h*100)+'%';
  const c=keep||{cx:C.cx, cy:C.cy}, s=C.cover*C.z; C.x=fw/2-c.cx*C.w*s; C.y=fh/2-c.cy*C.h*s; place();
}
function place(){ const s=C.cover*C.z, dw=C.w*s, dh=C.h*s; C.x=Math.min(0,Math.max(C.W-dw,C.x)); C.y=Math.min(0,Math.max(C.H-dh,C.y)); const st=cimg.style; st.width=dw+'px'; st.height=dh+'px'; st.left=(C.fx+C.x)+'px'; st.top=(C.fy+C.y)+'px'; $('#zoom').value=C.z; }
function zoomAt(z,px,py){ z=Math.min(4,Math.max(1,z)); const r=z/C.z; C.x=px-(px-C.x)*r; C.y=py-(py-C.y)*r; C.z=z; place(); }
function closeCrop(){ $('#crop').hidden=true; C=null; PT.clear(); if(sheet.classList.contains('open')){ const b=opts.querySelector('[data-id="pick"]'); if(b) b.focus(); } }
function applyCrop(){ const s=C.cover*C.z; S.photo={src:C.src, w:C.w, h:C.h, z:C.z, cx:(C.W/2-C.x)/(C.w*s), cy:(C.H/2-C.y)/(C.h*s)}; S.bg={type:'image'}; S.preview=null; save(); renderBg(); renderSheet(); closeCrop(); toast('배경을 바꿨어요'); }
area.addEventListener('pointerdown', e=>{ if(!C) return; area.setPointerCapture(e.pointerId); PT.set(e.pointerId,{x:e.clientX,y:e.clientY}); area.classList.add('drag'); });
area.addEventListener('pointermove', e=>{
  if(!C || !PT.has(e.pointerId)) return; const prev=PT.get(e.pointerId), cur={x:e.clientX,y:e.clientY};
  if(PT.size===1){ C.x+=cur.x-prev.x; C.y+=cur.y-prev.y; place(); }
  else { const other=[...PT.entries()].find(([k])=>k!==e.pointerId)[1], d0=Math.hypot(prev.x-other.x,prev.y-other.y)||1, d1=Math.hypot(cur.x-other.x,cur.y-other.y), ar=area.getBoundingClientRect();
    zoomAt(C.z*d1/d0, (cur.x+other.x)/2-ar.left-C.fx, (cur.y+other.y)/2-ar.top-C.fy); }
  PT.set(e.pointerId, cur);
});
['pointerup','pointercancel'].forEach(t=>area.addEventListener(t, e=>{ PT.delete(e.pointerId); if(!PT.size) area.classList.remove('drag'); }));
area.addEventListener('wheel', e=>{ if(!C) return; e.preventDefault(); const ar=area.getBoundingClientRect(); zoomAt(C.z*Math.exp(-e.deltaY*.0015), e.clientX-ar.left-C.fx, e.clientY-ar.top-C.fy); }, {passive:false});
area.addEventListener('keydown', e=>{
  if(!C) return; const k=e.key, st=12;
  if(k==='ArrowLeft') C.x-=st; else if(k==='ArrowRight') C.x+=st; else if(k==='ArrowUp') C.y-=st; else if(k==='ArrowDown') C.y+=st;
  else if(k==='+'||k==='='){ zoomAt(C.z*1.1,C.W/2,C.H/2); e.preventDefault(); return; }
  else if(k==='-'){ zoomAt(C.z/1.1,C.W/2,C.H/2); e.preventDefault(); return; }
  else return; e.preventDefault(); place();
});
$('#crop').addEventListener('keydown', e=>{ if(e.key==='Escape') closeCrop(); });
$('#zoom').addEventListener('input', e=>{ if(C) zoomAt(+e.target.value, C.W/2, C.H/2); });
$('#cropReset').addEventListener('click', ()=>{ if(!C) return; C.z=1; C.x=(C.W-C.w*C.cover)/2; C.y=(C.H-C.h*C.cover)/2; place(); });
$('#cropCancel').addEventListener('click', closeCrop);
$('#cropApply').addEventListener('click', ()=>{ if(C) applyCrop(); });

function announce(){
  const news = UNLOCKS.filter(u=>u.at>(S.seenAt||0) && u.at<=S.total);
  S.seenAt = S.total;
  if(news.length) showSide(news);
}
/* ---------- unlock sidebar ---------- */
const side=$('#side'), sideList=$('#sideList');
let sideItems=[], sideTimer=null, sideHold=false;
function sideThumb(u){
  if(u.cat==='bg') return '<span class="sw" style="'+patternCss(u.id)+'"></span>';
  if(u.cat==='lidcolor') return '<span class="sw" style="background:'+find(LIDCOLORS,u.id).v+'"></span>';
  const cup=clone(S.cup); applyItem(cup, S.bg, u.cat, u.id); return cupSVG(cup, {level:.78});
}
function renderSide(){
  sideList.innerHTML = sideItems.map((u,i)=>'<li class="side-item"><span class="side-th">'+sideThumb(u)+'</span><span class="side-tx"><b>'+u.name+josa(u.name,'이','가')+' 추가됐어요</b><small>'+(u.how==='buy' ? u.price+'P로 샀어요' : '모은 포인트 '+u.at+'P로 열렸어요')+'</small></span><button class="side-go" data-i="'+i+'" aria-pressed="'+(u.used?'true':'false')+'">'+(u.used?'적용됨':'바로 써보기')+'</button></li>').join('');
  const n = UNLOCKS.find(u=>u.at>S.total);
  $('#sideNext').innerHTML = n ? '모은 포인트가 <b>'+n.at+'P</b>가 되면 '+n.name+josa(n.name,'이','가')+' 열려요' : '해금 디자인을 모두 열었어요';
}
function armSide(){ clearTimeout(sideTimer); if(!sideHold) sideTimer=setTimeout(hideSide, 8000); }
function showSide(items){
  const known = new Set(sideItems.map(u=>u.cat+u.id+(u.how||'')));
  sideItems = items.slice().reverse().filter(u=>!known.has(u.cat+u.id+(u.how||''))).map(u=>Object.assign({}, u)).concat(sideItems).slice(0,6);
  renderSide();
  if(side.hidden){ side.hidden=false; side.style.transform=''; requestAnimationFrame(()=>requestAnimationFrame(()=>side.classList.add('show'))); }
  armSide();
}
function hideSide(){
  clearTimeout(sideTimer); side.classList.remove('show','drag'); side.style.transform='';
  setTimeout(()=>{ if(!side.classList.contains('show')){ side.hidden=true; sideItems=[]; } }, 420);
}
$('#sideX').addEventListener('click', hideSide);
sideList.addEventListener('click', e=>{
  const b=e.target.closest('.side-go'); if(!b) return; const u=sideItems[+b.dataset.i]; if(!u || u.used) return;
  S.bg = applyItem(S.cup, S.bg, u.cat, u.id); S.preview=null; u.used=true;
  save(); mountCup(); renderBg(); renderPanel(); renderSide(); if(sheet.classList.contains('open')) renderSheet();
  armSide();
});
['pointerenter','focusin'].forEach(t=>side.addEventListener(t, ()=>{ sideHold=true; clearTimeout(sideTimer); }));
['pointerleave','focusout'].forEach(t=>side.addEventListener(t, ()=>{ sideHold=false; armSide(); }));
side.addEventListener('keydown', e=>{ if(e.key==='Escape') hideSide(); });
let sx=null, sdx=0;
side.addEventListener('pointerdown', e=>{ if(e.target.closest('button')) return; sx=e.clientX; sdx=0; side.setPointerCapture(e.pointerId); side.classList.add('drag'); });
side.addEventListener('pointermove', e=>{ if(sx==null) return; sdx=Math.max(0, e.clientX-sx); side.style.transform='translateX('+sdx+'px)'; });
['pointerup','pointercancel'].forEach(t=>side.addEventListener(t, ()=>{ if(sx==null) return; sx=null; side.classList.remove('drag'); if(sdx>70) hideSide(); else side.style.transform=''; }));

window.addEventListener('resize', ()=>{ renderBg(); if(!document.body.classList.contains('editing')) panelRatio(); if(C) layoutCrop(false); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });

/* ---------- firebase: login / earn / boot ---------- */
function gate(msg, sub, btn){
  const g=$('#gate'); g.hidden=false;
  g.innerHTML='<div><p>'+esc(msg)+(sub?'<small>'+esc(sub)+'</small>':'')+'</p>'+(btn?'<button id="gateLogin">로그인</button>':'')+'</div>';
  const b=$('#gateLogin'); if(b) b.addEventListener('click', login);
}
function fmtLeft(ms){ const m=Math.ceil(ms/60000), h=Math.floor(m/60); return h>0 ? h+'시간 '+(m%60)+'분' : m+'분'; }
function renderAuth(){ $('#authBtn').textContent = staff ? String(staff.email||'계정').split('@')[0]+' · 로그아웃' : '로그인'; }
function login(){
  signInWithPopup(auth, provider).catch(e=>{ if(e.code!=='auth/popup-closed-by-user' && e.code!=='auth/cancelled-popup-request') toast('로그인하지 못했어요'); });
}
$('#authBtn').addEventListener('click', ()=>{ if(staff) signOut(auth); else login(); });
async function tryEarn(){
  if(!ready || !staff || earnTried) return;
  earnTried = true;
  try{
    const r = await runTransaction(db, async tx=>{
      const d = (await tx.get(ref)).data(), now = Date.now(), last = d.lastEarnedAt||0;
      if(last && now-last < COOLDOWN) return {earned:false, last:last};
      const pts = (d.points||0)+POINTS_PER_SCAN, tot = (d.total!=null ? d.total : (d.points||0))+POINTS_PER_SCAN;
      tx.update(ref, {points:pts, total:tot, lastEarnedAt:now});
      return {earned:true, pts:pts, tot:tot, last:now};
    });
    S.lastEarnedAt = r.last;
    if(!r.earned){ renderStatus(); toast('아직 적립할 수 없어요. '+fmtLeft(remainMs())+' 뒤에 다시 와 주세요'); return; }
    const before = S.points;
    S.points = r.pts; S.total = r.tot; PH.om += 2.4;
    announce(); save(); renderPanel(); renderStatus(); animatePts(before);
    if(sheet.classList.contains('open')) renderSheet();
    toast((S.name||UID)+'님 +'+POINTS_PER_SCAN+'P 적립됐어요');
  }catch(e){ toast(e.code==='permission-denied' ? '이 계정으로는 적립할 수 없어요' : '적립하지 못했어요. 다시 시도해 주세요'); }
}
let booted = false, booting = false;
onAuthStateChanged(auth, u=>{
  staff = u; earnTried = false; renderAuth();
  if(!u){ gate('로그인이 필요해요', '로그인하면 내 텀블러를 볼 수 있어요', true); return; }
  if(booted){ $('#gate').hidden = true; tryEarn(); return; }
  if(!booting){ booting = true; boot().then(()=>{ booting = false; }); }
});
async function boot(){
  if(!UID){ gate('사용자 정보가 없어요', '주소 뒤에 ?uid=user001 처럼 사용자 번호를 붙여 주세요'); return; }
  try{
    ref = doc(db, 'users', UID);
    const snap = await getDoc(ref);
    if(!snap.exists()){ gate("'"+UID+"' 사용자를 찾을 수 없어요", '사용자 번호를 확인해 주세요 (예: user001)'); return; }
    applyDoc(snap.data());
  }catch(e){ gate('불러오지 못했어요', e.code==='permission-denied' ? '읽기 권한이 없어요' : '인터넷 연결을 확인해 주세요'); return; }
  fix(); disp = level();
  lastLook = JSON.stringify({cup:S.cup, bg:S.bg, seenAt:S.seenAt}); synced = lookKey(lookOf());
  ready = true; booted = true; $('#gate').hidden = true;
  renderBg(); mountCup(); renderPanel(); renderStatus();
  requestAnimationFrame(t=>{ lastT=t; panelRatio(); requestAnimationFrame(frame); });
  setTimeout(()=>{ announce(); save(); }, 700);
  tryEarn();
}
})();
</script>
